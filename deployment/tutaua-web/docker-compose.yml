services:
  tutaua-web:
    image: nginx:1.27-alpine
    container_name: tutaua-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - /opt/docker/tutaua-web/site:/usr/share/nginx/html:ro
      - /opt/docker/tutaua-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
